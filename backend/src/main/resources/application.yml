server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: n11-marketplace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/n11_marketplace}
    username: ${SPRING_DATASOURCE_USERNAME:n11_dev_user}
    password: ${SPRING_DATASOURCE_PASSWORD:n11_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

